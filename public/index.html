<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrollModz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#090b11;--card:#10131c;--in:#171a26;--bd:#1b3644;--cy:#4fd3f0;--mut:#7d8aa0;--fg:#eef3fa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 420px at 30% -5%,#12313a,transparent 70%),var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(28px,env(safe-area-inset-top)) 22px max(32px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:18px;margin-bottom:34px}
#logo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #2a7f92;box-shadow:0 0 0 3px #123844,0 0 22px #22d3ee55;background:#0b0d14;flex:none}
h1{margin:0;font-size:clamp(22px,7vw,34px);font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,#7fe3ff,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.sub{margin-top:6px;color:var(--mut);font-weight:600;font-size:clamp(13px,3.8vw,17px);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:26px;padding:20px 18px 18px;margin-bottom:22px}
.card h2{margin:0 0 14px 6px;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cy)}
.card h2::before{content:"";display:inline-block;border-left:6px solid var(--cy);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:10px}
.box{background:var(--in);border:1.5px solid #252a3a;border-radius:20px;padding:18px 22px}
.box b{display:block;font-size:18px;font-weight:700}
.box span{display:block;margin-top:4px;color:var(--mut);font-size:15px}
.drop{border:2px dashed #2c6577;border-radius:22px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 10px;background:transparent;width:100%;color:inherit;font-family:inherit;cursor:pointer}
.drop:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
#key{font-weight:800;font-size:clamp(18px,6vw,30px);letter-spacing:.05em;white-space:nowrap;text-shadow:0 0 16px #22d3ee44}
#key i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#hint{color:var(--mut);font-size:15px}
/* LED tím hồng chạy quanh mép web */
.led{position:fixed;inset:0;pointer-events:none;z-index:9;padding:3px;background:conic-gradient(from var(--ang),transparent 0 55%,#7c3aed 68%,#ff2bd6 82%,#ff7ae8 90%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 4s linear infinite;filter:drop-shadow(0 0 6px #d946ef)}
@keyframes spin{to{--ang:360deg}}
@media (prefers-reduced-motion:reduce){.led{animation:none}}
</style>
</head>
<body>
<div class="led"></div>
<div class="wrap">
  <header>
    <img id="logo" alt="" src="/logo.svg">
    <div><h1 id="name">GETKEYTROLLMODZ</h1><div class="sub" id="sub"></div></div>
  </header>

  <section class="card">
    <h2>Đây là key TrollModz của bạn</h2>
    <div class="box"><b>chúc bạn chơi game vui vẻ</span></div>
  </section>

  <section class="card">
    <h2>Key</h2>
    <button class="drop" id="copy" type="button">
      <div id="key">vui lòng chờ</div>
      <div id="hint">Chạm để sao chép</div>
    </button>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
let cur="";
fetch("/api/config").then(r=>r.json()).then(c=>{
  $("name").textContent=c.name;$("sub").textContent=c.sub;$("logo").src=c.logo;document.title=c.name;
}).catch(()=>{});
fetch("/api/key",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  cur=d.key;$("key").innerHTML="<i>"+cur.slice(0,4)+"</i>"+cur.slice(4);
}).catch(()=>{$("hint").textContent="Không tải được key, thử lại sau";});
$("copy").addEventListener("click",()=>{
  if(!cur)return;
  (navigator.clipboard?navigator.clipboard.writeText(cur):Promise.reject()).catch(()=>{});
  $("hint").textContent="Đã sao chép";setTimeout(()=>$("hint").textContent="Chạm để sao chép",1600);
});
</script>
</body>
</html>
